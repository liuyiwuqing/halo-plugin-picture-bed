apiVersion: v1alpha1
kind: Setting
metadata:
  name: picture-bed-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: array
          name: pictureBeds
          label: 图床接口
          value: []
          help: 图床接口配置
          min: 1
          itemLabels:
            - type: text
              label: $value.pictureBedName
            - type: text
              label: $value.pictureBedType
          children:
            # Halo 2.23 起 array 组件把条目放进弹窗渲染，作用域只绑了 value，$index 不再可用。
            # 改用顶层的 $pictureBeds.length 取新条目下标；旧条目已存的 ID 会被父级值覆盖，不受影响。
            # 不能加 validation: required：字段是 disabled 的，取不到值时用户无法手工补，会卡死保存。
            # 最终 ID 以 PictureBedConfig#getPictureBeds 的归一化结果为准。
            - $formkit: text
              disabled: true
              name: pictureBedId
              key: pictureBedId
              label: 图床 ID
              value: $pictureBeds.length
              help: 用于区分同类型下的多个图床实例，保存时由系统自动分配
            - $formkit: select
              id: pictureBedType
              name: pictureBedType
              key: pictureBedType
              label: 图床类型
              value: pan123
              options:
                - label: 兰空图床
                  value: lsky
                - label: SM.MS图床
                  value: smms
                - label: ImgTP图床
                  value: imgtp
                - label: 123盘图床
                  value: pan123
            - $formkit: text
              name: pictureBedName
              key: pictureBedName
              label: 图床名称
              value: ""
              help: 图床名称
              validation: required
            - $formkit: switch
              name: pictureBedEnabled
              key: pictureBedEnabled
              label: 是否启用
              value: false
            # 互斥由后端 PictureBedConfig#getPictureBeds 在读取时强制：靠前的实例胜出。
            # Halo 渲染的设置表单不归插件管，没法在保存时弹窗让用户二选一，所以这里只能靠 help 提示。
            - $formkit: switch
              name: pictureBedEditorUpload
              key: pictureBedEditorUpload
              label: 作为编辑器上传目标
              value: false
              help: 开启后，在文章编辑器里粘贴或拖入图片会直接上传到该图床。只能有一个图床开启，多开时取靠前的那个，实际生效的目标在“工具 -> 图床管理”页顶部显示
            - $formkit: text
              name: pictureBedUrl
              key: pictureBedUrl
              label: API 地址
              value: ""
              help: 如 https://sm.ms/api/v2/，末尾带 /
              validation: required|url
            - $formkit: text
              name: pictureBedToken
              key: pictureBedToken
              label: API Token
              value: ""
              help: 图床 API Token
              validation: required
            - $formkit: text
              if: "$value.pictureBedType === 'lsky'"
              name: pictureBedStrategyId
              key: pictureBedStrategyId
              label: 储存策略ID
              value: ""
              help: 图床的存储策略 id
            - $formkit: text
              if: "$value.pictureBedType === 'pan123'"
              name: pictureBedClientId
              key: pictureBedClientId
              label: client_id
              value: ""
              help: 123云盘OpenAPI的 client_id
            - $formkit: text
              if: "$value.pictureBedType === 'pan123'"
              name: pictureBedClientSecret
              key: pictureBedClientSecret
              label: client_secret
              value: ""
              help: 123云盘OpenAPI的 client_secret
