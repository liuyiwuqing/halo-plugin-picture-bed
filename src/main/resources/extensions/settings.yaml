apiVersion: v1alpha1
kind: Setting
metadata:
  name: picture-bed-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: array
          name: pictureBeds
          label: 图床接口
          value: []
          help: 图床接口配置
          min: 1
          itemLabels:
            - type: text
              label: $value.pictureBedName
            - type: text
              label: $value.pictureBedType
          children:
            # Halo 2.23 起 array 组件把条目放进弹窗渲染，作用域只绑了 value，$index 不再可用。
            # 改用顶层的 $pictureBeds.length 取新条目下标；旧条目已存的 ID 会被父级值覆盖，不受影响。
            # 不能加 validation: required：字段是 disabled 的，取不到值时用户无法手工补，会卡死保存。
            # 最终 ID 以 PictureBedConfig#getPictureBeds 的归一化结果为准。
            - $formkit: text
              disabled: true
              name: pictureBedId
              key: pictureBedId
              label: 图床 ID
              value: $pictureBeds.length
              help: 用于区分同类型下的多个图床实例，保存时由系统自动分配
            - $formkit: select
              id: pictureBedType
              name: pictureBedType
              key: pictureBedType
              label: 图床类型
              value: pan123
              options:
                - label: 兰空图床
                  value: lsky
                - label: SM.MS图床
                  value: smms
                - label: ImgTP图床
                  value: imgtp
                - label: 123盘图床
                  value: pan123
                - label: CloudFlare ImgBed
                  value: cfimgbed
            - $formkit: text
              name: pictureBedName
              key: pictureBedName
              label: 图床名称
              value: ""
              help: 图床名称
              validation: required
            - $formkit: switch
              name: pictureBedEnabled
              key: pictureBedEnabled
              label: 是否启用
              value: false
            - $formkit: text
              name: pictureBedUrl
              key: pictureBedUrl
              label: API 地址
              value: ""
              help: 其他图床填接口基础地址，如 https://sm.ms/api/v2/；CloudFlare ImgBed 填站点根地址，如 https://img.example.com/。末尾均带 /
              validation: required|url
            - $formkit: text
              name: pictureBedToken
              key: pictureBedToken
              label: API Token
              value: ""
              help: 图床 API Token。CloudFlare ImgBed 需在后台创建同时具备 upload、list、delete 权限的 API Token
              validation: required
            - $formkit: text
              if: "$value.pictureBedType === 'lsky'"
              name: pictureBedStrategyId
              key: pictureBedStrategyId
              label: 储存策略ID
              value: ""
              help: 图床的存储策略 id
            - $formkit: text
              if: "$value.pictureBedType === 'pan123'"
              name: pictureBedClientId
              key: pictureBedClientId
              label: client_id
              value: ""
              help: 123云盘OpenAPI的 client_id
            - $formkit: text
              if: "$value.pictureBedType === 'pan123'"
              name: pictureBedClientSecret
              key: pictureBedClientSecret
              label: client_secret
              value: ""
              help: 123云盘OpenAPI的 client_secret
            - $formkit: select
              if: "$value.pictureBedType === 'cfimgbed'"
              name: pictureBedUploadChannel
              key: pictureBedUploadChannel
              label: 上传渠道
              value: telegram
              help: 需与 CloudFlare ImgBed 后台已配置的存储渠道一致，否则会先失败再自动切换
              options:
                - label: Telegram
                  value: telegram
                - label: Cloudflare R2
                  value: cfr2
                - label: S3
                  value: s3
                - label: Discord
                  value: discord
                - label: HuggingFace
                  value: huggingface
                - label: WebDAV
                  value: webdav
            - $formkit: text
              if: "$value.pictureBedType === 'cfimgbed'"
              name: pictureBedCdnUrl
              key: pictureBedCdnUrl
              label: 自定义访问域名
              value: ""
              help: 图片链接使用的域名，如 https://cdn.example.com/，末尾带 /。留空则使用上方 API 地址拼接
